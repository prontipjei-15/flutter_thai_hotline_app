name: flutter_thai_hotline_app
description: "แอปสายด่วน THAILAND สำหรับการเรียน"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  font_awesome_flutter: ^11.0.0
  google_fonts: ^9.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/images/aboutme/
    - assets/images/bank/
    - assets/images/emergency/
    - assets/images/pubutil/
    - assets/images/travel/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/icon.png
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
  web:
    generate: true
    image_path: assets/icon.png
    background_color: '#FFFFFF'
    theme_color: '#1F3554'
